[package]
name = "form-deform-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
form-deform-core = { path = "../crates/form-deform-core" }
serde_json = "1"

[[bin]]
name = "mesh_geometry"
path = "fuzz_targets/mesh_geometry.rs"
test = false
doc = false
bench = false

[[bin]]
name = "payload_json"
path = "fuzz_targets/payload_json.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
