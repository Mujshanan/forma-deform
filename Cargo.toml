[workspace]
members = [
    "crates/smart-controller-core",
    "crates/form-deform-core",
    "crates/anicraft-plugin-sdk",
    "plugins/bone-query",
    "plugins/smart-controller",
]
resolver = "2"

[workspace.package]
repository = "https://github.com/Mujshanan/forma-deform"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"
