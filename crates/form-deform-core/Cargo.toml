[package]
name = "form-deform-core"
version = "0.1.0"
edition = "2024"
description = "Deterministic bone-driven warp-pin deformation math"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[lib]
path = "src/lib.rs"

[[bench]]
name = "curve_sampling"
harness = false
