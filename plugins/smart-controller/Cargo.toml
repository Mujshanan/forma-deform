[package]
name = "anicraft-smart-controller-plugin"
version = "0.1.0"
edition = "2024"
description = "On-demand AniCraft bone-to-target Smart Controller plugin"
license = "MIT"
publish = false
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anicraft-plugin-sdk = { path = "../../crates/anicraft-plugin-sdk" }
smart-controller-core = { path = "../../crates/smart-controller-core" }
serde_json = { workspace = true }

[dev-dependencies]
form-deform-core = { path = "../../crates/form-deform-core" }

[lints]
workspace = true
