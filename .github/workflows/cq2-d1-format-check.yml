name: CQ2 D1 formatting check

on:
  push:
    branches: [quality/cq2-d1-controller-validation]
    paths:
      - "docs/quality/d1-format-trigger.txt"

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality/cq2-d1-controller-validation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
