name: Apply and verify CQ2 rustfmt patch

on:
  push:
    branches: [quality/cq2-rustfmt-apply]
    paths:
      - "docs/quality/rustfmt-apply-trigger.txt"

permissions:
  actions: read
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality/cq2-rustfmt-apply
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - name: Download the previously reviewed formatter patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/rustfmt"
          gh run download 45117139008 --repo Mujshanan/forma-deform --name cq2-rustfmt-patch --dir "$RUNNER_TEMP/rustfmt"
          test -s "$RUNNER_TEMP/rustfmt/rustfmt.patch"
          test -s "$RUNNER_TEMP/rustfmt/rustfmt-files.txt"
      - name: Verify patch scope and apply
        run: |
          cd "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD^)" = "975045cbcd43bd9b1e2195041d06a057d514721d"
          cd "$RUNNER_TEMP/rustfmt"
          grep -Ev '\.rs$' rustfmt-files.txt && exit 1 || true
          test "$(wc -l < rustfmt-files.txt | tr -d ' ')" = "47"
          cd "$GITHUB_WORKSPACE"
          git apply --check "$RUNNER_TEMP/rustfmt/rustfmt.patch"
          git apply "$RUNNER_TEMP/rustfmt/rustfmt.patch"
          git diff --name-only | sort > "$RUNNER_TEMP/actual-files.txt"
          sort "$RUNNER_TEMP/rustfmt/rustfmt-files.txt" > "$RUNNER_TEMP/expected-files.txt"
          diff -u "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/actual-files.txt"
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "47"
      - name: Verify rustfmt
        run: cargo fmt --all -- --check
      - name: Run Rust workspace tests
        run: cargo test --workspace
      - name: Build all three release WASM plugins
        run: |
          cargo build --release --target wasm32-unknown-unknown -p anicraft-bone-query-plugin
          cargo build --release --target wasm32-unknown-unknown -p anicraft-form-deform-plugin
          cargo build --release --target wasm32-unknown-unknown -p anicraft-smart-controller-plugin
      - name: Commit formatting-only source patch
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style: apply rustfmt formatting across workspace"
          git push origin HEAD:quality/cq2-rustfmt-apply
