name: CQ2 Formatting Review

on:
  push:
    branches: [quality/cq2-formatting-review, quality/cq2-formatting-patch]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rustfmt:
    name: stable rustfmt check and patch
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit revision
        uses: actions/checkout@v4

      - name: Install stable Rust with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Record toolchain
        run: rustc --version && cargo --version && rustfmt --version

      - name: Check workspace formatting
        id: check
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Generate formatting-only patch for review
        if: always()
        shell: bash
        run: |
          mkdir -p quality-reports
          cargo fmt --all
          git diff --check
          git diff --binary > quality-reports/rustfmt.patch
          git diff --stat > quality-reports/rustfmt-stat.txt
          git diff --name-only > quality-reports/rustfmt-files.txt
          git diff --quiet && echo "No formatting changes required" > quality-reports/result.txt || echo "Formatting patch generated; source checkout was not committed" > quality-reports/result.txt

      - name: Upload formatting review patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cq2-rustfmt-patch
          path: quality-reports/
          if-no-files-found: error
          retention-days: 30

      - name: Preserve formatting check result
        if: steps.check.outcome == 'failure'
        run: exit 1
