name: CI

permissions:
  contents: write

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - name: Format FDM-01.3 source
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/fdm-01-3-single-handle-displacement'
        run: |
          rustfmt --edition 2024 crates/form-deform-core/src/single_handle_displacement.rs
          if ! git diff --quiet -- crates/form-deform-core/src/single_handle_displacement.rs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/form-deform-core/src/single_handle_displacement.rs
            git commit -m "style(fdm-01.3): apply rustfmt"
            git push origin "HEAD:$GITHUB_HEAD_REF"
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: cargo fmt --manifest-path crates/form-deform-core/Cargo.toml -- --check
      - run: cargo clippy --manifest-path crates/form-deform-core/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --target wasm32-unknown-unknown -p anicraft-bone-query-plugin
      - run: cargo build --release --target wasm32-unknown-unknown -p anicraft-form-deform-plugin
      - run: cargo build --release --target wasm32-unknown-unknown -p anicraft-smart-controller-plugin
