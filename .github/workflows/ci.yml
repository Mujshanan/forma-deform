name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Check FDM regression-test formatting
        run: rustfmt --edition 2024 --check crates/form-deform-core/src/single_handle_displacement.rs crates/form-deform-core/src/evaluation_engine.rs crates/form-deform-core/tests/fdm_01_regression.rs
      - name: Lint FDM core
        run: cargo clippy --manifest-path crates/form-deform-core/Cargo.toml --all-targets -- -D warnings -A clippy::too_many_arguments
      - name: Run FDM core tests
        run: cargo test -p form-deform-core --all-targets
      - name: Run Rust workspace tests
        run: cargo test --workspace
      - name: Build bone-query WASM plugin
        run: cargo build --release --target wasm32-unknown-unknown -p anicraft-bone-query-plugin
      - name: Build Form Deform WASM plugin
        run: cargo build --release --target wasm32-unknown-unknown -p anicraft-form-deform-plugin
      - name: Build Smart Controller WASM plugin
        run: cargo build --release --target wasm32-unknown-unknown -p anicraft-smart-controller-plugin
